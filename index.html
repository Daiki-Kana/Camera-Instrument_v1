<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>カメラ骨格認識</title>
  <link rel="stylesheet" href="./style.css?v=5_3">
</head>
<body>
  <div id="container">
    <!-- 4:3アスペクト比を維持する表示ステージ -->
    <div id="stage">
      <!-- カメラ映像（iOS Safari向けインライン再生設定） -->
      <video id="webcam" autoplay playsinline webkit-playsinline muted></video>
      <!-- 骨格描画用キャンバス -->
      <canvas id="output_canvas"></canvas>
    </div>
    <!-- 読み込み中・エラー時の最小限メッセージ（起動後は非表示） -->
    <div id="status-message">カメラを初期化中...</div>
    <!-- 実際のカメラ解像度とFPSの表示（確認用） -->
    <div id="info-badge">-- x --</div>
    <!-- 拍手で鳴らす音色の切り替えスイッチ（ボタンは main.js で生成） -->
    <div id="sound-switch"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
