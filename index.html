<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>カメラ楽器</title>
  <link rel="stylesheet" href="./style.css?v=5_3">
</head>
<body>
  <div id="container">
    <!-- 5:3アスペクト比を維持する表示ステージ -->
    <div id="stage">
      <!-- カメラ映像（iOS Safari向けインライン再生設定） -->
      <video id="webcam" autoplay playsinline webkit-playsinline muted></video>
      <!-- 手・拍手判定の描画用キャンバス -->
      <canvas id="output_canvas"></canvas>
    </div>

    <!-- 読み込み中・エラー時の最小限メッセージ（起動後は非表示） -->
    <div id="status-message">カメラを初期化中...</div>

    <!-- 音声が無効な間だけ表示する案内 -->
    <div id="audio-hint" class="glass">タップして音を有効にする</div>

    <!-- 設定ボタンと設定パネル -->
    <button id="settings-toggle" class="glass" type="button" aria-label="設定" aria-expanded="false" aria-controls="settings-panel">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="16" cy="7" r="2" stroke="currentColor" stroke-width="2" fill="none"/>
        <circle cx="10" cy="17" r="2" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
    </button>
    <div id="settings-panel" class="glass" hidden>
      <div class="panel-row">
        <label for="lead-slider">先読み</label>
        <span id="lead-value" class="panel-value">--ms</span>
      </div>
      <input id="lead-slider" type="range" min="0" max="200" step="10">
      <p class="panel-note">音が遅れて聞こえるなら上げ、早すぎるなら下げる</p>

      <button id="camera-switch" type="button">カメラを切り替え</button>

      <dl class="stats">
        <dt>FPS（処理 / カメラ）</dt><dd data-stat="fps">--</dd>
        <dt>推論時間</dt><dd data-stat="inference">--</dd>
        <dt>音の出力遅延</dt><dd data-stat="output">--</dd>
        <dt>検出した手</dt><dd data-stat="hands">--</dd>
        <dt>手のひらの距離</dt><dd data-stat="ratio">--</dd>
        <dt>拍手の回数</dt><dd data-stat="claps">--</dd>
      </dl>
    </div>

    <!-- 拍手で鳴らす音色の切り替え（ボタンは main.js で生成） -->
    <div id="sound-switch" class="glass" role="group" aria-label="音色"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
